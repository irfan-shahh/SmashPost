services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
  user_app:
    build:
      network: host
      context: ./
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - 3000:8000
    depends_on:
       postgres:
         condition: service_healthy